<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <script src="calc.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="display">
        <div id="expression"></div>
        <div id="screen">0</div>
      </div>
      <div id="lower-box">
        <div id="header">
          <button id="clear" class="hbtn">C</button>
          <button id="delete" class="hbtn">Del</button>
          <button id="percent" class="hbtn">%</button>
          <button id="toggle-sign" class="hbtn">±</button>
        </div>
        <div id="nums" class="nums">
          <button id="sqrt" class="btn">√</button>
          <button id="seven" class="btn">7</button>
          <button id="eight" class="btn">8</button>
          <button id="nine" class="btn">9</button>
          <button id="divide" class="btn">÷</button>
          <button id="four" class="btn">4</button>
          <button id="five" class="btn">5</button>
          <button id="six" class="btn">6</button>
          <button id="mult" class="btn">×</button>
          <button id="one" class="btn">1</button>
          <button id="two" class="btn">2</button>
          <button id="three" class="btn">3</button>
          <button id="sub" class="btn">-</button>
          <button id="zero" class="btn">0</button>
          <button id="period" class="btn">.</button>
          <button id="add" class="btn">+</button>
          <button id="eq" class="btn">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
